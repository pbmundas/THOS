# =====================================================================
# THOS :: On-Prem AI Threat Hunting Platform — Phase 1
# =====================================================================
# Stack: Ollama (Qwen) + ChromaDB (RAG) + FastMCP (tools) + LangGraph
#        (orchestrator) + Postgres (audit/state) + Redis (cache) +
#        React analyst UI + secured FastAPI gateway
#
# Quickstart:
#   cp .env.example .env          # then edit as needed
#   docker compose up -d --build
#   open http://localhost:7860
#
# Stop:     docker compose down
# Reset:    docker compose down -v   (wipes vector db / postgres / ollama data)
#
# See docs/SCALING_GUIDE.md for how to add new SIEMs, tools, and nodes.
# ---------------------------------------------------------------------

# =====================================================================
# THOS :: On-Prem AI Threat Hunting Platform — Phase 1
# =====================================================================

# ============================================================
# THOS :: On-Prem AI Threat Hunting Platform — Phase 1
# ============================================================

networks:
  thos-net:
    driver: bridge

volumes:
  ollama_data:
  chroma_data:
  postgres_data:
  redis_data:
  sigmahq_rules:
  sigma_queries:
  yara_community_rules:
  yara_catalog:
  chroma_embedding_cache:

services:

  # ------------------------------------------------------------
  # 1. Ollama — Local LLM Inference
  # ------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: thos-ollama
    restart: unless-stopped
    # No host port binding: only other containers on thos-net (mcp,
    # orchestrator) need to reach Ollama. If you want to pull/manage
    # models from the host directly, temporarily add back
    # `ports: ["11434:11434"]` — just don't leave it published on a
    # shared or internet-facing host.
    volumes:
      - ollama_data:/root/.ollama
    environment:
      # Keep the small query model resident after the initializer warms it so
      # the first analyst hunt uses the sub-second warm path.
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
    networks:
      - thos-net
    # GPU inference: without this reservation, Ollama silently falls back to
    # CPU, which for a 7B model is the single biggest latency contributor in
    # the whole pipeline. Requires the NVIDIA Container Toolkit on the host
    # (nvidia-ctk runtime configured for Docker). Set OLLAMA_GPU_COUNT=0 (or
    # remove this block) on hosts with no NVIDIA GPU available.
    # Resource limits: without these, Ollama/Chroma/Postgres/etc. can starve
    # each other on a shared host. Every env var below has a default but is
    # overridable per-deploy in .env.
    deploy:
      resources:
        limits:
          cpus: "${OLLAMA_CPU_LIMIT:-4}"
          memory: ${OLLAMA_MEM_LIMIT:-8g}
        reservations:
          devices:
            - driver: nvidia
              count: ${OLLAMA_GPU_COUNT:-all}
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  ollama-model-init:
    image: ollama/ollama:latest
    container_name: thos-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - thos-net
    environment:
      OLLAMA_HOST: ollama:11434
      MODEL_NAMES: "${OLLAMA_MODEL:-qwen3:4b} ${THOS_MODEL_QUERY:-qwen2.5-coder:1.5b-instruct}"
      QUERY_MODEL: ${THOS_MODEL_QUERY:-qwen2.5-coder:1.5b-instruct}
    deploy:
      resources:
        limits:
          cpus: "${OLLAMA_INIT_CPU_LIMIT:-1}"
          memory: ${OLLAMA_INIT_MEM_LIMIT:-512m}
    entrypoint: ["/bin/sh", "-c"]
    # Retries the pull a few times (useful on a slow/flaky first-time
    # download) and DOES NOT swallow the final failure — if the model
    # still isn't present after retries, this container exits non-zero,
    # which (combined with `service_completed_successfully` below) stops
    # mcp/orchestrator from starting against a model that was never
    # actually pulled, instead of silently 404'ing at hunt time.
    command:
      - |
        for MODEL_NAME in $$MODEL_NAMES; do
          READY=0;
          for i in 1 2 3 4 5; do
            echo "[ollama-model-init] pull attempt $$i for $$MODEL_NAME";
            if ollama pull "$$MODEL_NAME"; then READY=1; break; fi;
            echo "[ollama-model-init] pull failed, retrying in 10s...";
            sleep 10;
          done;
          if [ "$$READY" != "1" ] || ! ollama list | grep -q "$$(echo $$MODEL_NAME | cut -d: -f1)"; then
            echo "[ollama-model-init] FATAL: $$MODEL_NAME not present after retries";
            exit 1;
          fi;
          echo "[ollama-model-init] confirmed $$MODEL_NAME is available";
        done;
        echo "[ollama-model-init] warming query model $$QUERY_MODEL";
        ollama run "$$QUERY_MODEL" "Return only OK." >/dev/null;
    restart: "no"

  # ------------------------------------------------------------
  # 2. ChromaDB — Vector Store
  # ------------------------------------------------------------
  chromadb:
    image: chromadb/chroma:latest
    container_name: thos-chromadb
    restart: unless-stopped
    # No host port binding: chromadb has no auth of its own in this stack,
    # so it must stay reachable only from other containers on thos-net
    # (kb-ingest, mcp), not from the host's network.
    volumes:
      - chroma_data:/data
    environment:
      ANONYMIZED_TELEMETRY: "FALSE"
      ALLOW_RESET: "TRUE"
    networks:
      - thos-net
    deploy:
      resources:
        limits:
          cpus: "${CHROMA_CPU_LIMIT:-2}"
          memory: ${CHROMA_MEM_LIMIT:-2g}
    healthcheck:
      test: ["CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/127.0.0.1/8000"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ------------------------------------------------------------
  # 3. Knowledge Base Ingest
  # ------------------------------------------------------------
  kb-ingest:
    build:
      context: .
      dockerfile: services/knowledge/Dockerfile
    container_name: thos-kb-ingest
    environment:
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      KB_ROOT: /data/knowledge_base
      CYBER_CORPUS_ENABLED: ${CYBER_CORPUS_ENABLED:-1}
      CYBER_CORPUS_REQUIRED: ${CYBER_CORPUS_REQUIRED:-0}
      CYBER_CORPUS_SOURCE_IDS: ${CYBER_CORPUS_SOURCE_IDS:-}
      CYBER_CORPUS_MANIFEST: /data/knowledge_sources/cybersecurity_sources.json
    volumes:
      - ./data/knowledge_base:/data/knowledge_base:ro
      - ./data/knowledge_sources:/data/knowledge_sources:ro
      - sigmahq_rules:/repo/services/detection/sigma_rules_hq:ro
      - chroma_embedding_cache:/root/.cache/chroma
    depends_on:
      chromadb:
        condition: service_healthy
      sigmahq-rules-init:
        condition: service_completed_successfully
    networks:
      - thos-net
    deploy:
      resources:
        limits:
          cpus: "${KB_INGEST_CPU_LIMIT:-1}"
          memory: ${KB_INGEST_MEM_LIMIT:-1g}
    restart: "no"

  # ------------------------------------------------------------
  # 4. Postgres — Audit & State
  # ------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: thos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-thos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-thos_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-thos_audit}
    # No host port binding: the password above is a weak default, so the
    # only thing actually keeping this database safe right now is that it's
    # unreachable outside thos-net. Add back `ports: ["5432:5432"]` only for
    # temporary local debugging, and set a real POSTGRES_PASSWORD first.
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    networks:
      - thos-net
    deploy:
      resources:
        limits:
          cpus: "${POSTGRES_CPU_LIMIT:-2}"
          memory: ${POSTGRES_MEM_LIMIT:-2g}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-thos} -d ${POSTGRES_DB:-thos_audit}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ------------------------------------------------------------
  # 5. Redis — Cache / Sessions
  # ------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: thos-redis
    restart: unless-stopped
    # Redis has no auth by default at all, so require a password. Same
    # weak-default-with-warning pattern as the other secrets — the
    # orchestrator/mcp REDIS_URL below must include the same password.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-thos_change_me_redis}"]
    volumes:
      - redis_data:/data
    networks:
      - thos-net
    # No host port binding: only mcp and orchestrator need Redis, and both
    # reach it over thos-net.
    deploy:
      resources:
        limits:
          cpus: "${REDIS_CPU_LIMIT:-1}"
          memory: ${REDIS_MEM_LIMIT:-512m}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-thos_change_me_redis}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ------------------------------------------------------------
  # 6. SigmaHQ Rules — one-shot corpus initializer
  # ------------------------------------------------------------
  sigmahq-rules-init:
    build:
      context: .
      dockerfile: services/detection/Dockerfile.sigma-init
    container_name: thos-sigmahq-rules-init
    restart: "no"
    environment:
      # Pinned for reproducible deployments. Override deliberately to test
      # another upstream commit; never use a moving branch in production.
      SIGMAHQ_REF: ${SIGMAHQ_REF:-282369fa76c5cd6103b055478fbaebec8530cfa5}
      SIGMAHQ_MIN_RULES: ${SIGMAHQ_MIN_RULES:-2000}
      SIGMAHQ_VENDOR_DIR: /vendor
      SIGMAHQ_RULES_DIR: /rules
    volumes:
      # Prefer a reviewed, committed corpus for offline deployments. The
      # initializer downloads the pinned ref only when this directory and
      # the persistent rules volume do not contain a complete corpus.
      - ./services/detection/sigma_rules_hq:/vendor:ro
      - sigmahq_rules:/rules
    networks:
      - thos-net
    deploy:
      resources:
        limits:
          cpus: "${SIGMAHQ_INIT_CPU_LIMIT:-1}"
          memory: ${SIGMAHQ_INIT_MEM_LIMIT:-512m}

  # Compile the complete pinned corpus once. Hunts and scheduled detections
  # reuse this catalog instead of compiling rules or downloading unfiltered
  # enterprise telemetry at runtime.
  sigma-query-init:
    build:
      context: .
      dockerfile: services/detection/Dockerfile.sigma-query-init
    container_name: thos-sigma-query-init
    restart: "no"
    environment:
      SIGMAHQ_RULES_DIR: /rules
      SIGMAHQ_MIN_RULES: ${SIGMAHQ_MIN_RULES:-2000}
      SIGMA_QUERY_CATALOG_DIR: /catalog
      SIGMA_QUERY_BACKENDS: ${SIGMA_QUERY_BACKENDS:-splunk,wazuh,qradar,logrhythm}
    volumes:
      - sigmahq_rules:/rules:ro
      - sigma_queries:/catalog
    depends_on:
      sigmahq-rules-init:
        condition: service_completed_successfully
    networks:
      - thos-net
    deploy:
      resources:
        limits:
          cpus: "${SIGMA_QUERY_INIT_CPU_LIMIT:-2}"
          memory: ${SIGMA_QUERY_INIT_MEM_LIMIT:-2g}

  # ------------------------------------------------------------
  # 7. MCP Server — SOC Tools
  # ------------------------------------------------------------
  yararules-init:
    build:
      context: .
      dockerfile: services/detection/Dockerfile.yara-init
    container_name: thos-yararules-init
    restart: "no"
    environment:
      # Pinned for reproducible and reviewable deployments.
      YARARULES_REF: ${YARARULES_REF:-0f93570194a80d2f2032869055808b0ddcdfb360}
      YARARULES_MIN_FILES: ${YARARULES_MIN_FILES:-500}
      YARARULES_VENDOR_DIR: /vendor
      YARARULES_RULES_DIR: /rules
    volumes:
      - ./services/detection/yara_rules_community:/vendor:ro
      - yara_community_rules:/rules
    networks:
      - thos-net
    deploy:
      resources:
        limits:
          cpus: "${YARARULES_INIT_CPU_LIMIT:-1}"
          memory: ${YARARULES_INIT_MEM_LIMIT:-512m}

  # Compile every compatible upstream file once. Invalid legacy files are
  # quarantined in catalog metadata instead of breaking the usable corpus.
  yara-catalog-init:
    build:
      context: .
      dockerfile: services/detection/Dockerfile.yara-catalog-init
    container_name: thos-yara-catalog-init
    restart: "no"
    environment:
      YARARULES_RULES_DIR: /rules
      YARARULES_MIN_FILES: ${YARARULES_MIN_FILES:-500}
      YARA_CATALOG_DIR: /catalog
    volumes:
      - yara_community_rules:/rules:ro
      - yara_catalog:/catalog
    depends_on:
      yararules-init:
        condition: service_completed_successfully
    networks:
      - thos-net
    deploy:
      resources:
        limits:
          cpus: "${YARA_CATALOG_INIT_CPU_LIMIT:-2}"
          memory: ${YARA_CATALOG_INIT_MEM_LIMIT:-2g}

  mcp:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: thos-mcp
    restart: unless-stopped
    # No host port binding: MCP_AUTH_TOKEN now gates every tool call, but
    # only the orchestrator needs to reach this service, and it does so
    # over thos-net. Add back `ports: ["8100:8100"]` only for temporary
    # local debugging.
    environment:
      TZ: ${TZ:-Asia/Kolkata}
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b}
      THOS_MODEL_FAST: ${THOS_MODEL_FAST:-${THOS_MODEL_QUERY:-qwen2.5-coder:1.5b-instruct}}
      THOS_MODEL_QUERY: ${THOS_MODEL_QUERY:-qwen2.5-coder:1.5b-instruct}
      THOS_FAST_GENERATION_TIMEOUT_SECONDS: ${THOS_FAST_GENERATION_TIMEOUT_SECONDS:-60}
      THOS_FAST_GENERATION_RETRIES: ${THOS_FAST_GENERATION_RETRIES:-1}
      THOS_FAST_NUM_CTX: ${THOS_FAST_NUM_CTX:-4096}
      THOS_FAST_NUM_PREDICT: ${THOS_FAST_NUM_PREDICT:-256}
      THOS_FAST_KEEP_ALIVE: ${THOS_FAST_KEEP_ALIVE:-30m}
      THOS_QUERY_GENERATION_TIMEOUT_SECONDS: ${THOS_QUERY_GENERATION_TIMEOUT_SECONDS:-30}
      THOS_QUERY_GENERATION_RETRIES: ${THOS_QUERY_GENERATION_RETRIES:-1}
      THOS_QUERY_NUM_CTX: ${THOS_QUERY_NUM_CTX:-4096}
      THOS_QUERY_NUM_PREDICT: ${THOS_QUERY_NUM_PREDICT:-256}
      THOS_QUERY_KEEP_ALIVE: ${THOS_QUERY_KEEP_ALIVE:-30m}
      OLLAMA_GENERATION_RETRIES: ${OLLAMA_GENERATION_RETRIES:-3}
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      CYBER_KB_MAX_DISTANCE: ${CYBER_KB_MAX_DISTANCE:-1.35}
      REDIS_URL: redis://:${REDIS_PASSWORD:-thos_change_me_redis}@redis:6379/0
      POSTGRES_DSN: postgresql://${POSTGRES_USER:-thos}:${POSTGRES_PASSWORD:-thos_change_me}@postgres:5432/${POSTGRES_DB:-thos_audit}
      MCP_PORT: 8100
      MCP_TRANSPORT: streamable-http
      # Structured JSON logs to stdout (services/observability/logging_config.py).
      # One of DEBUG/INFO/WARNING/ERROR.
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      NO_REBIND_PROTECTION: "1"
      # Shared secret the orchestrator must present as a bearer token on
      # every MCP tool call. Must match the orchestrator's MCP_AUTH_TOKEN
      # below. Change this in .env before deploying anywhere but a
      # trusted local dev box.
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:-thos_change_me_mcp_token}
      REPORTS_DIR: /data/reports
      THOS_RUNTIME_CONFIG: /data/runtime/config.json
      DETECTION_PROPOSALS_DIR: /data/detection_rule_proposals
      SIEM_TYPE: ${SIEM_TYPE:-mock}
      LOG_SOURCE_DIR: /data/log_sources
      WAZUH_INDEXER_URL: ${WAZUH_INDEXER_URL:-https://host.docker.internal:9200}
      WAZUH_INDEXER_USERNAME: ${WAZUH_INDEXER_USERNAME:-}
      WAZUH_INDEXER_PASSWORD: ${WAZUH_INDEXER_PASSWORD:-}
      WAZUH_VERIFY_SSL: ${WAZUH_VERIFY_SSL:-1}
      WAZUH_CA_BUNDLE: ${WAZUH_CA_BUNDLE:-}
      WAZUH_INDEX_SOURCE: ${WAZUH_INDEX_SOURCE:-both}
      WAZUH_LOOKBACK_MINUTES: ${WAZUH_LOOKBACK_MINUTES:-1440}
      WAZUH_REQUEST_TIMEOUT_SECONDS: ${WAZUH_REQUEST_TIMEOUT_SECONDS:-30}
      WAZUH_MAX_RESULTS: ${WAZUH_MAX_RESULTS:-1000}
      ELASTICSEARCH_URL: ${ELASTICSEARCH_URL:-}
      ELASTICSEARCH_INDEX_PATTERN: ${ELASTICSEARCH_INDEX_PATTERN:-}
      ELASTICSEARCH_API_KEY: ${ELASTICSEARCH_API_KEY:-}
      ELASTICSEARCH_USERNAME: ${ELASTICSEARCH_USERNAME:-}
      ELASTICSEARCH_PASSWORD: ${ELASTICSEARCH_PASSWORD:-}
      ELASTICSEARCH_VERIFY_SSL: ${ELASTICSEARCH_VERIFY_SSL:-1}
      ELASTICSEARCH_CA_BUNDLE: ${ELASTICSEARCH_CA_BUNDLE:-}
      ELASTICSEARCH_LOOKBACK_MINUTES: ${ELASTICSEARCH_LOOKBACK_MINUTES:-1440}
      ELASTICSEARCH_REQUEST_TIMEOUT_SECONDS: ${ELASTICSEARCH_REQUEST_TIMEOUT_SECONDS:-30}
      ELASTICSEARCH_MAX_RESULTS: ${ELASTICSEARCH_MAX_RESULTS:-1000}
      SIGMAHQ_RULES_DIR: /repo/services/detection/sigma_rules_hq
      YARA_LOCAL_RULES_DIR: /data/yara-local
      YARARULES_RULES_DIR: /data/yara-community
      YARA_CATALOG_DIR: /data/yara-catalog
      YARARULES_MIN_FILES: ${YARARULES_MIN_FILES:-500}
      YARARULES_MIN_READY_RULES: ${YARARULES_MIN_READY_RULES:-500}
      YARA_MAX_FILE_BYTES: ${YARA_MAX_FILE_BYTES:-268435456}
      YARA_SCAN_TIMEOUT_SECONDS: ${YARA_SCAN_TIMEOUT_SECONDS:-30}
      SIGMAHQ_MIN_RULES: ${SIGMAHQ_MIN_RULES:-2000}
      SIGMAHQ_REF: ${SIGMAHQ_REF:-282369fa76c5cd6103b055478fbaebec8530cfa5}
      SIGMA_QUERY_CATALOG_DIR: /data/sigma_queries
      SIGMA_HUNT_MAX_RULES: ${SIGMA_HUNT_MAX_RULES:-64}
      SIGMA_QUERY_CONCURRENCY: ${SIGMA_QUERY_CONCURRENCY:-6}
      SIGMA_WEEKLY_MAX_RULES: ${SIGMA_WEEKLY_MAX_RULES:-0}
      SIEM_SCHEMA_REFRESH_SECONDS: ${SIEM_SCHEMA_REFRESH_SECONDS:-604800}
      SIEM_SCHEMA_RETENTION_SECONDS: ${SIEM_SCHEMA_RETENTION_SECONDS:-3024000}
    volumes:
      - ./data/reports:/data/reports
      - ./data/detection_rule_proposals:/data/detection_rule_proposals
      - ./data/threat_intel:/data/threat_intel:ro
      - ./data/log_sources:/data/log_sources
      - ./data/runtime:/data/runtime
      - chroma_embedding_cache:/root/.cache/chroma
      # The initializer guarantees this volume has the pinned community
      # corpus before MCP starts; MCP only receives a read-only view.
      - sigmahq_rules:/repo/services/detection/sigma_rules_hq:ro
      - sigma_queries:/data/sigma_queries:ro
      - ./services/detection/yara_rules:/data/yara-local:ro
      - yara_community_rules:/data/yara-community:ro
      - yara_catalog:/data/yara-catalog:ro
    deploy:
      resources:
        limits:
          cpus: "${MCP_CPU_LIMIT:-2}"
          memory: ${MCP_MEM_LIMIT:-2g}
    depends_on:
      chromadb:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      ollama-model-init:
        condition: service_completed_successfully
      sigmahq-rules-init:
        condition: service_completed_successfully
      sigma-query-init:
        condition: service_completed_successfully
      yara-catalog-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -m services.detection.verify_sigmahq_rules --quiet && python -m services.detection.verify_yara_catalog --quiet"]
      interval: 30s
      timeout: 15s
      retries: 3
    networks:
      - thos-net

  # ------------------------------------------------------------
  # 8. Orchestrator — LangGraph Engine
  # ------------------------------------------------------------
  orchestrator:
    build:
      context: .
      dockerfile: services/orchestration/Dockerfile
    container_name: thos-orchestrator
    restart: unless-stopped
    # No host port binding: ORCHESTRATOR_API_KEY now gates every functional
    # endpoint, but only the chat-ui needs to reach this service, and it
    # does so over thos-net. Add back `ports: ["8200:8200"]` only for
    # temporary local debugging.
    environment:
      TZ: ${TZ:-Asia/Kolkata}
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b}
      THOS_MODEL_FAST: ${THOS_MODEL_FAST:-qwen2.5-coder:1.5b-instruct}
      THOS_FAST_NUM_CTX: ${THOS_FAST_NUM_CTX:-4096}
      THOS_FAST_NUM_PREDICT: ${THOS_FAST_NUM_PREDICT:-512}
      THOS_MODEL_REASONING: ${THOS_MODEL_REASONING:-${OLLAMA_MODEL:-qwen3:4b}}
      # The evidence prompt and completion share Ollama's context window.
      # 8K can leave only ~1K output tokens, truncating structured JSON at a
      # repeatable character offset before the final braces are emitted.
      THOS_REASONING_NUM_CTX: ${THOS_REASONING_NUM_CTX:-16384}
      THOS_REASONING_NUM_PREDICT: ${THOS_REASONING_NUM_PREDICT:-2048}
      OLLAMA_GENERATION_TIMEOUT_SECONDS: ${OLLAMA_GENERATION_TIMEOUT_SECONDS:-180}
      # Large evidence-grounded JSON responses on CPU can legitimately exceed
      # the generic 180s transport window. Let one attempt finish instead of
      # cancelling valid inference and multiplying latency across three strikes.
      THOS_REASONING_GENERATION_TIMEOUT_SECONDS: ${THOS_REASONING_GENERATION_TIMEOUT_SECONDS:-360}
      THOS_REASONING_KEEP_ALIVE: ${THOS_REASONING_KEEP_ALIVE:-30m}
      # Point this at a second Ollama host or GPU worker to isolate scheduled
      # reasoning from interactive hunts. The default preserves one-worker
      # deployments until an operator provides the separate endpoint.
      THOS_SCHEDULED_OLLAMA_HOST: ${THOS_SCHEDULED_OLLAMA_HOST:-http://ollama:11434}
      THOS_SCHEDULED_MODEL: ${THOS_SCHEDULED_MODEL:-}
      THOS_SCHEDULED_NUM_CTX: ${THOS_SCHEDULED_NUM_CTX:-16384}
      THOS_SCHEDULED_NUM_PREDICT: ${THOS_SCHEDULED_NUM_PREDICT:-2048}
      OLLAMA_GENERATION_RETRIES: ${OLLAMA_GENERATION_RETRIES:-3}
      MAX_REASONING_FOLLOWUPS: ${MAX_REASONING_FOLLOWUPS:-1}
      MCP_SERVER_URL: http://mcp:8100/mcp
      # Must match mcp's MCP_AUTH_TOKEN above — this is how the orchestrator
      # authenticates to the MCP server as a client.
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:-thos_change_me_mcp_token}
      # Callers of *this* service (the chat UI, or any other client) must
      # send `Authorization: Bearer <ORCHESTRATOR_API_KEY>`. Must match
      # chat-ui's ORCHESTRATOR_API_KEY below.
      ORCHESTRATOR_API_KEY: ${ORCHESTRATOR_API_KEY:-thos_change_me_orchestrator_key}
      POSTGRES_DSN: postgresql://${POSTGRES_USER:-thos}:${POSTGRES_PASSWORD:-thos_change_me}@postgres:5432/${POSTGRES_DB:-thos_audit}
      REDIS_URL: redis://:${REDIS_PASSWORD:-thos_change_me_redis}@redis:6379/0
      REPORTS_DIR: /data/reports
      FORENSIC_ROOT: /data/log_sources/forensic
      FORENSIC_MAX_RECORDS: ${FORENSIC_MAX_RECORDS:-50000}
      FORENSIC_MAX_DOCUMENT_TEXT: ${FORENSIC_MAX_DOCUMENT_TEXT:-2097152}
      THOS_RISK_CACHE_SECONDS: ${THOS_RISK_CACHE_SECONDS:-60}
      THOS_WAZUH_MSEARCH_BATCH_SIZE: ${THOS_WAZUH_MSEARCH_BATCH_SIZE:-8}
      THOS_WAZUH_MSEARCH_RULE_LIMIT: ${THOS_WAZUH_MSEARCH_RULE_LIMIT:-10}
      THOS_RUNTIME_CONFIG: /data/runtime/config.json
      DETECTION_PROPOSALS_DIR: /data/detection_rule_proposals
      # Structured JSON logs to stdout (services/observability/logging_config.py).
      # One of DEBUG/INFO/WARNING/ERROR.
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SIGMAHQ_RULES_DIR: /repo/services/detection/sigma_rules_hq
      SIGMAHQ_MIN_RULES: ${SIGMAHQ_MIN_RULES:-2000}
      SIGMAHQ_REF: ${SIGMAHQ_REF:-282369fa76c5cd6103b055478fbaebec8530cfa5}
      SIGMA_QUERY_CATALOG_DIR: /data/sigma_queries
      SIGMA_HUNT_MAX_RULES: ${SIGMA_HUNT_MAX_RULES:-64}
      SIGMA_QUERY_CONCURRENCY: ${SIGMA_QUERY_CONCURRENCY:-6}
      SIGMA_DEDUP_WINDOW_SECONDS: ${SIGMA_DEDUP_WINDOW_SECONDS:-3600}
      YARA_LOCAL_RULES_DIR: /data/yara-local
      YARARULES_RULES_DIR: /data/yara-community
      YARA_CATALOG_DIR: /data/yara-catalog
      YARARULES_MIN_FILES: ${YARARULES_MIN_FILES:-500}
      YARARULES_MIN_READY_RULES: ${YARARULES_MIN_READY_RULES:-500}
      YARA_MAX_FILE_BYTES: ${YARA_MAX_FILE_BYTES:-268435456}
      YARA_SCAN_TIMEOUT_SECONDS: ${YARA_SCAN_TIMEOUT_SECONDS:-30}
      SIEM_SCHEMA_REFRESH_SECONDS: ${SIEM_SCHEMA_REFRESH_SECONDS:-604800}
    volumes:
      - ./data/reports:/data/reports
      - ./data/log_sources:/data/log_sources
      - ./data/detection_rule_proposals:/data/detection_rule_proposals
      - ./data/threat_intel:/data/threat_intel:ro
      - ./data/runtime:/data/runtime
      - sigmahq_rules:/repo/services/detection/sigma_rules_hq:ro
      - sigma_queries:/data/sigma_queries:ro
      - ./services/detection/yara_rules:/data/yara-local:ro
      - yara_community_rules:/data/yara-community:ro
      - yara_catalog:/data/yara-catalog:ro
    deploy:
      resources:
        limits:
          cpus: "${ORCHESTRATOR_CPU_LIMIT:-2}"
          memory: ${ORCHESTRATOR_MEM_LIMIT:-2g}
    depends_on:
      mcp:
        condition: service_healthy
      ollama:
        condition: service_healthy
      ollama-model-init:
        condition: service_completed_successfully
      sigma-query-init:
        condition: service_completed_successfully
      yara-catalog-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    networks:
      - thos-net

  # ------------------------------------------------------------
  # 9. Analyst UI — React workspace + secured FastAPI gateway
  # ------------------------------------------------------------
  chat-ui:
    build:
      context: .
      dockerfile: services/api/Dockerfile.chatui
    container_name: thos-chat-ui
    restart: unless-stopped
    ports:
      - "7860:7860"
    environment:
      ORCHESTRATOR_URL: http://orchestrator:8200
      OLLAMA_HOST: http://ollama:11434
      THOS_SCHEDULED_OLLAMA_HOST: ${THOS_SCHEDULED_OLLAMA_HOST:-http://ollama:11434}
      THOS_OLLAMA_MEMORY_BUDGET_GB: ${THOS_OLLAMA_MEMORY_BUDGET_GB:-8}
      THOS_OLLAMA_MEMORY_OVERHEAD_FACTOR: ${THOS_OLLAMA_MEMORY_OVERHEAD_FACTOR:-4}
      THOS_OLLAMA_METRICS_URL: ${THOS_OLLAMA_METRICS_URL:-}
      THOS_OLLAMA_MEMORY_HIGH_RATIO: ${THOS_OLLAMA_MEMORY_HIGH_RATIO:-0.80}
      THOS_OLLAMA_MEMORY_CRITICAL_RATIO: ${THOS_OLLAMA_MEMORY_CRITICAL_RATIO:-0.95}
      THOS_SIEM_LATENCY_HIGH_MS: ${THOS_SIEM_LATENCY_HIGH_MS:-5000}
      THOS_HUNT_QUEUE_HIGH: ${THOS_HUNT_QUEUE_HIGH:-1}
      THOS_RUNTIME_CONFIG: /data/runtime/config.json
      THOS_SCHEDULED_SIGMA_CONCURRENCY: ${THOS_SCHEDULED_SIGMA_CONCURRENCY:-2}
      THOS_SIGMA_RULES_PER_BATCH: ${THOS_SIGMA_RULES_PER_BATCH:-8}
      THOS_SCHEDULED_YARA_CONCURRENCY: ${THOS_SCHEDULED_YARA_CONCURRENCY:-1}
      SIEM_SCHEMA_REFRESH_INTERVAL_HOURS: ${SIEM_SCHEMA_REFRESH_INTERVAL_HOURS:-168}
      SIEM_SCHEMA_REFRESH_RETRY_HOURS: ${SIEM_SCHEMA_REFRESH_RETRY_HOURS:-6}
      TZ: ${TZ:-Asia/Kolkata}
      SIGMAHQ_UI_RULES_DIR: /data/sigmahq
      SIGMA_LOCAL_UI_RULES_DIR: /data/sigma-local
      YARA_LOCAL_RULES_DIR: /data/yara-local
      YARARULES_RULES_DIR: /data/yara-community
      YARA_CATALOG_DIR: /data/yara-catalog
      # Must match orchestrator's ORCHESTRATOR_API_KEY above — this is how
      # the chat UI authenticates to the orchestrator API as a client.
      ORCHESTRATOR_API_KEY: ${ORCHESTRATOR_API_KEY:-thos_change_me_orchestrator_key}
      # Credentials accepted by the branded SOCmate login page. Change these in
      # .env before deploying anywhere but a trusted local dev box.
      # Single-user default:
      CHATUI_USERNAME: ${CHATUI_USERNAME:-analyst}
      CHATUI_PASSWORD: ${CHATUI_PASSWORD:-thos_change_me}
      # HMAC key for the HTTP-only analyst session cookie. Use a long random
      # value in production. Enable Secure cookies when serving through HTTPS.
      CHATUI_SESSION_SECRET: ${CHATUI_SESSION_SECRET:-thos_change_me_session_key}
      CHATUI_SESSION_TTL_SECONDS: ${CHATUI_SESSION_TTL_SECONDS:-43200}
      CHATUI_SECURE_COOKIE: ${CHATUI_SECURE_COOKIE:-0}
      # For more than one analyst login, set CHATUI_USERS instead (takes
      # precedence over CHATUI_USERNAME/CHATUI_PASSWORD when non-empty):
      #   CHATUI_USERS=alice:pw1,bob:pw2
      CHATUI_USERS: ${CHATUI_USERS:-}
      REPORTS_DIR: /data/reports
      LOG_SOURCE_DIR: /data/log_sources
      FORENSIC_ROOT: /data/log_sources/forensic
      THOS_THREAT_INTEL_ROOT: /data/threat_intel
      THOS_IOC_BLOCKLIST_PATH: /data/threat_intel/blocklist.json
      THOS_IOC_LOCAL_SOURCE_ROOT: /data/ioc_sources
      THOS_IOC_MAX_SOURCE_BYTES: ${THOS_IOC_MAX_SOURCE_BYTES:-104857600}
      THOS_IOC_ALLOW_PRIVATE_FETCH: ${THOS_IOC_ALLOW_PRIVATE_FETCH:-0}
      FORENSIC_MAX_FILE_BYTES: ${FORENSIC_MAX_FILE_BYTES:-21474836480}
      FORENSIC_MAX_CASE_BYTES: ${FORENSIC_MAX_CASE_BYTES:-107374182400}
      # Structured gateway logs to stdout. One of DEBUG/INFO/WARNING/ERROR.
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./data/reports:/data/reports
      - ./data/log_sources:/data/log_sources
      - ./data/runtime:/data/runtime
      - ./data/threat_intel:/data/threat_intel
      - ./data/ioc_sources:/data/ioc_sources
      - ./services/detection/sigma_rules:/data/sigma-local:ro
      - ./services/detection/yara_rules:/data/yara-local:ro
      - yara_community_rules:/data/yara-community:ro
      - yara_catalog:/data/yara-catalog:ro
      - sigmahq_rules:/data/sigmahq:ro
    deploy:
      resources:
        limits:
          cpus: "${CHATUI_CPU_LIMIT:-1}"
          memory: ${CHATUI_MEM_LIMIT:-1g}
    depends_on:
      - orchestrator
      - ollama
    networks:
      - thos-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7860/health"]
      interval: 15s
      timeout: 5s
      retries: 10
